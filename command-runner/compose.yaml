# mobilerun command-runner viewer (dev server)
#
# 起動: docker compose up -d  (このディレクトリで)
# 停止: docker compose down
# ログ: docker compose logs -f viewer
#
# 公開はしない方針: image 名に localhost/ プレフィックス → docker push 不可
#
# 制限事項:
#   - macOS Docker Desktop で adb mdns 探索を使う場合は host networking が必要 (4.34+ で要 opt-in)。
#     ポートマッピング (デフォルト) でも viewer の編集機能はフル稼働、adb 自動探索だけ動かない。
#   - 自動探索が動かない時は viewer の「手動入力」タブで IP:port を入れる。

services:
  viewer:
    # Google 公式 platform-tools (adb) は linux/amd64 しか配布していないので明示。
    # Apple Silicon では Rosetta 経由 (Docker Desktop > Settings > 'Use Rosetta...' を ON)
    platform: linux/amd64
    build:
      # build context は repo root。mobilerun 本体ソースを含めるため
      context: ..
      dockerfile: command-runner/Dockerfile
      platforms:
        - linux/amd64
    image: localhost/mobilerun-command-runner:local
    container_name: mobilerun-command-runner
    restart: unless-stopped
    ports:
      - "3101:3101"   # Hono API
      - "3102:3102"   # Vite dev server (ブラウザはこっち)
    # host networking を使いたい場合 (Linux / macOS Docker Desktop 4.34+):
    #   network_mode: host
    #   ports: 削除
    user: "node"
    volumes:
      # command-runner ディレクトリを bind mount → ホストの編集が即反映
      - .:/app
      # node_modules は image 内のものを使う (host 側に流出しない)
      - /app/node_modules
      # mobilerun 本体ソースを bind mount → editable install の参照先と一致させる
      - ..:/opt/mobilerun-src
      # adb クライアントの鍵 + ペアリング履歴 (adb_known_hosts.pb) を永続化。
      # コンテナを recreate しても一度成功したペアリングが残るので、
      # 「毎回ペアリングからやり直し」を防ぐ。
      - adb-keys:/home/node/.android
      # mobilerun のホスト config を共有 (Anthropic OAuth 認証など)
      # platformdirs 経由で参照される config.yaml 用
      - ${HOME}/Library/Application Support/droidrun:/home/node/.config/droidrun
      # config.yaml 内の credential_path はホスト絶対パス (/Users/<u>/Library/...) で
      # ハードコードされているので、同じパスを container 内にもマウントして解決させる
      - ${HOME}/Library/Application Support/droidrun:/Users/ymt/Library/Application Support/droidrun
      # Claude Code CLI の認証 / 設定をホストから持ち込む。
      # ホストで先に `claude /login` 済みなら、コンテナ内 claude もそのままログイン状態になる。
      # ディレクトリが存在しないと bind mount で空ディレクトリが作られるだけ (害なし)。
      - ${HOME}/.claude:/home/node/.claude
      - ${HOME}/.config/claude:/home/node/.config/claude
    environment:
      - NODE_ENV=development
      - TZ=Asia/Tokyo
      - ADB_BIN=adb
      - MOBILERUN_BIN=mobilerun
      # Claude Code CLI が認証情報を探すパス。bind mount 先と一致させる。
      - CLAUDE_CONFIG_DIR=/home/node/.claude
      - CLAUDE_BIN=claude
      # claude を実行するときの cwd。repo root を指して .claude/skills/* を見せる
      - CLAUDE_CWD=/opt/mobilerun-src
      # adb サーバーの所在:
      #
      # [既定] コンテナ内で adb サーバーを起動する。
      #   - WSL2 / 純 Linux ホストはこちらでよい (ホスト adb との共有不要)。
      #   - 制限: マルチキャスト mDNS は docker bridge を越えられないので
      #     「自動探索 / QR ペアリング」タブは空になる。代わりに UI の
      #     「手動入力」タブから ip:port + PIN を直接入れて pair → connect する。
      #
      # [Mac で mDNS 探索を使いたい場合] 以下のコメントを外し、ホストで
      # 事前に `adb -a -P 5037 nodaemon server start &` を一度実行しておく。
      # - ADB_SERVER_SOCKET=tcp:host.docker.internal:5037
      # - ANDROID_ADB_SERVER_HOST=host.docker.internal
      # - ANDROID_ADB_SERVER_PORT=5037
    # Linux でも host.docker.internal を解決させる
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  adb-keys:
