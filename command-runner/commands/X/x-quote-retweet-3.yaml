notes: タイムラインの通常投稿を上から順に3件引用リツイート (コメントは実行時に生成)
prompt: |
  Xアプリを開きホームタイムラインの『おすすめ』(For You) を表示してください (フォロー中タブにいたら『おすすめ』に切替 タブ切替はこの1回のみ)。上から順に通常投稿（広告 センシティブ 政治 宣伝色の強いものは避ける）を合計3件 引用リツイートしてください。1件ずつ: (a) 投稿本文と文脈を読み取り 短い日本語コメントを2〜3行 合計80文字以内で1度だけドラフト 一度決めたら書き直さない【スタイル: 『！』を積極的に使う / 読点『、』は使わず半角スペースか改行で区切る / 煽りや営業色は避ける / 絵文字0〜2個 / 素朴な感想】 (b) その投稿のアクションバー(下部に常時表示 追加スクロール不要 左から 返信/リポスト/いいね/ブックマーク/共有)の【2番目=リポスト(円形の矢印)】をタップ 1番目の返信と間違えない (座標なら画面幅1080で x=350〜400付近) (c) 出てきたメニューで『引用』を選択 (d) 引用作成画面でコメントを入力し 送信ボタン(『リポスト』表示が正しい)をタップして送信 (e) 『ポストを送信しました』トーストが出たら次の投稿へ。同じ投稿を二重で引用しない。投稿が見つからなければ下スクロール1回。いいねやリプライは押さない。3件終えたら 各引用先(投稿者名)とコメントを報告して終了。
