notes: アトミック - X の検索画面で keyword を入力し、検索結果のうち『最新』(Latest) タブの一覧を表示
parameters:
  - name: keyword
    description: X 検索に入れるキーワード。ハッシュタグでも自由語でも可
    required: true
prompt: |
  X アプリの検索画面で、以下のキーワードで検索し、結果のうち『最新』(Latest) タブの投稿一覧が見える状態にして停止してください。

  キーワード:
  ---
  {{keyword}}
  ---

  ## 手順
  1. 既に検索画面でなければ画面下部の『検索』(虫眼鏡) タブをタップ
  2. 上部の検索ボックスをタップし、上のキーワードを**そのまま**入力
  3. キーボードの『検索』/『Enter』をタップして検索実行
  4. 結果画面の上部タブで『最新』(Latest) を選択 (デフォルトは『話題』なので明示的にタップ)
  5. 投稿のリストが見えるところで停止
  6. 上位 3 件の投稿の投稿者名 + 本文先頭 20 文字程度を報告して終了

  ## 絶対禁止
  - 結果画面で個別投稿のいいね/リプライなどはしない (続きの操作は呼び出し側スキルが指示する)
