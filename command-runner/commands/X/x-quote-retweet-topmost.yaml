id: x-quote-retweet-topmost
name: X 最上位投稿を引用リツイート
type: run
steps: 12
vision: true
reasoning: true
status: unconfirmed
tags:
  - x
  - atomic
  - quote
notes: アトミック - 表示中の TL の最上位投稿を、指定コメント付きで引用リツイート
parameters:
  - name: comment
    description: 引用リツイートに添えるコメント本文 (100 文字以内推奨、読点は使わない)
    required: true
prompt: |
  現在表示中の X のタイムラインで、一番上に見えている通常投稿 (広告・センシティブ・宣伝色強は除外) を以下のコメント付きで引用リツイートしてください。

  コメント本文:
  ---
  {{comment}}
  ---

  ## 手順
  1. 対象投稿の下部アクションバーの **2番目 (リポスト / 円形矢印アイコン)** をタップ
  2. 出てきたメニューから『引用』(Quote) を選ぶ
  3. 開いた投稿作成画面の本文欄に上のコメントを**そのまま**入力
  4. 右上の『ポストする』ボタンをタップして送信
  5. TL に戻ったら成功。元投稿の投稿者名と本文先頭 20 文字を報告して終了

  ## 絶対禁止
  - 本文を改変しない
  - リポスト (素のリツイート) を選ばない、必ず引用 (Quote) を選ぶ
  - いいねやリプライは押さない
