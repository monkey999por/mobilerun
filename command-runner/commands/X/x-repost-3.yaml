notes: タイムラインの通常投稿を上から順に3件 通常リポスト (引用ではない コメント無し)
prompt: |
  Xアプリを開きホームタイムラインの『おすすめ』(For You) を表示してください (フォロー中タブにいたら『おすすめ』に切替 タブ切替はこの1回のみ)。上から順に通常投稿（広告 センシティブ 政治 宣伝色の強いものは避ける）を合計3件 通常リポスト(引用ではない コメント無しのリポスト)してください。1件ずつ: (a) その投稿のアクションバー(下部に常時表示 追加スクロール不要 左から 返信/リポスト/いいね/ブックマーク/共有)の【2番目=リポスト(円形の矢印)】をタップ 1番目の返信と間違えない (座標なら画面幅1080で x=350〜400付近) (b) 出てきたメニューで『リポスト』を選択(『引用』ではない コメントは付けない) (c) リポストが完了しリポストアイコンが緑色になったら次の投稿へ。既にリポスト済み(緑)の投稿はスキップ。同じ投稿を二重でリポストしない。投稿が見つからなければ下スクロール1回。いいね・リプライ・引用は一切行わない。3件リポストし終えたら 各リポスト先(投稿者名)を報告して終了。
