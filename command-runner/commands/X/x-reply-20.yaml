notes: タイムラインの通常投稿に上から順に20件リプライ (リプライ文は実行時に生成)
prompt: |
  Xアプリを開いてホームタイムラインの『おすすめ』タブ (For You) を表示し (フォロー中タブにいたら『おすすめ』に切替) 上から順に通常投稿（広告 センシティブ 政治 宣伝色の強いものは避ける）に合計20件リプライしてください。1件ずつ確実に: (a) 投稿本文と文脈を読み取り (b) 人間が自然に書く短い日本語リプライを3行程度 合計100文字以内で考える【スタイル: 丁寧な敬語ベースだが『〜ですね！』程度の軽い崩しはOK / 『！』を積極的に使う / 読点『、』は絶対に使わず半角スペースや改行で区切る / 煽りや営業色は避ける / 絵文字は0〜2個 / 素朴な共感】 (c) 投稿をタップして詳細を開き リプライアイコン(吹き出し)をタップ→入力欄に文章を入力→『返信する』または『ポストする』で送信 (d) 送信確認のトーストが出たら戻る(←)でタイムラインに復帰し 次の未リプライ投稿へ。同じ投稿に二重でリプライしない。画面下まで来たら下スクロール1回。リツイートやいいねは押さない。20件送信し終えたら 各リプライ先(投稿者名)と送信文を報告して終了。
