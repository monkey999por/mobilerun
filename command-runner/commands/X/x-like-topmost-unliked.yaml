notes: アトミック - 現在表示中の TL で一番上の未いいね通常投稿のハートを1回だけタップ
prompt: |
  現在表示中の X のタイムライン上で、一番上に見えている未いいねの**通常投稿**のハートアイコンを1回だけタップしていいねを付けてください。

  ## 🔴 最重要
  - **投稿本文 / 画像 / 動画 / プロフィールアイコン / ユーザー名は絶対にタップしない**
  - 各投稿の下部アクションバーの **3番目のハート (いいね) アイコンだけ**をタップする
  - アクションバーの並びは左から: 返信 / リポスト / **いいね** / ブックマーク / 共有
  - **ハートは1回タップしたら絶対に再タップしない**。1回のタップでいいねは確実に登録される。視覚的に塗りつぶし(赤/ピンク)を確認できなくても、それは画面更新の遅延であって失敗ではない。再タップするといいねが**解除**されるので厳禁。タップ後の「確認のための再タップ」は一切しないこと。

  ## 既いいね判定
  ハートが赤やピンクで塗りつぶされている投稿は既いいね。塗りつぶされていない (白抜き) ハートだけが対象。

  ## スキップ対象
  - 広告 / Promoted / センシティブ警告 / 既いいね
  - 『誰々をフォロー』のようなおすすめユーザーカード (投稿ではない)

  ## 手順
  1. 上から順に見える投稿を評価し、最初に見つかった未いいね通常投稿のハートを1回タップ
  2. タップは1回で完了。塗りつぶしの再確認や再タップはせず、即座に終了する (スクロールしない、追加でいいねしない)
  3. どの投稿 (投稿者名 + 本文先頭 20 文字程度) にいいねしたかを報告

  ## 見つからなかった場合
  画面内に対象が無ければ "no target visible" と報告して終了 (この場合は呼び出し側がスクロールしてからリトライする)
