id: x-reply-topmost
name: X 最上位投稿にリプライ送信
type: run
steps: 12
vision: true
reasoning: true
status: unconfirmed
tags:
  - x
  - atomic
  - reply
notes: アトミック - 表示中の TL の最上位投稿に指定文面でリプライを送信
parameters:
  - name: reply_text
    description: 送信するリプライ本文。読点は使わず ! や半角スペースで区切る。100 文字以内推奨
    required: true
prompt: |
  現在表示中の X のタイムラインで、一番上に見えている通常投稿 (広告・センシティブ・宣伝色強は除外) に対して、以下の文面でリプライを送信してください。

  リプライ本文:
  ---
  {{reply_text}}
  ---

  ## 手順
  1. 対象投稿の下部アクションバーの **1番目 (返信 / 吹き出しアイコン)** をタップ
  2. 開いたリプライ作成画面の本文欄に上の文面を**そのまま**入力 (改変しない)
  3. 右上の『返信する』または『ポストする』ボタンをタップして送信
  4. トーストや TL に戻ったら成功。投稿者名と本文先頭 20 文字を報告して終了

  ## 絶対禁止
  - 投稿本文 / 画像 / プロフィール画像をタップしない (詳細画面に入らない)
  - いいね / リポスト / ブックマークを押さない
  - 本文を勝手に書き換えない
