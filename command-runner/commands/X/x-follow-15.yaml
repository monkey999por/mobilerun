prompt: Xアプリでおすすめユーザーを15人フォローしてください。【画面遷移は以下のルートを厳守】 1) 下部メニュー右側の『検索』タブ（虫眼鏡アイコン）をタップ 2) 検索画面が開いたら 上部の『おすすめ』サブタブ（デフォルトで選択済み）のままにする。検索バー（Xを検索）は絶対にタップしないこと（タップすると最近の検索履歴が出るだけで おすすめユーザーは出ない）。『折りたたむ』ボタンも触らないこと 3) 『おすすめ』サブタブの内容（トレンドニュースが並ぶ）を下方向にスクロールし続けると 最下部に『おすすめユーザー』セクションが現れる。スクロールは1〜3回必要 4) 『おすすめユーザー』セクションが見えたら その下にある『さらに表示』ボタンをタップして専用ページを開く（このページのほうがユーザーが多くフォローボタンも押しやすい） 5) 専用ページが開いたら 表示されているユーザーを上から順に評価し 適格なら即座に『フォローする』ボタンをタップする（順序を入れ替えてあとで戻るような操作は禁止 上から1人ずつ確定していく）。【選定基準】 公式アカウントや企業/法人アカウント（◯◯株式会社 代表取締役 公式 ニュース系など）は避ける ギャンブル（スロパチ パチスロ 競馬など）アカウントは避ける センシティブな内容のアカウントも避ける オンラインサロン運営や情報商材系も避ける。できるだけ日本語で活動している個人アカウントを優先する。【手順】 ページに表示された候補が15人に満たない場合のみ下スクロールして追加候補を見つける。スクロール後も同じく『上から順に評価して適格ならその場でフォロー』を繰り返す。15人フォローし終わったら 誰をフォローしたか（表示名 @ハンドル 一言プロフィール）を報告して終了してください。
