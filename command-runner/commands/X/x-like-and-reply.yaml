prompt: "Xアプリを開いてホームタイムラインの『おすすめ』タブ (For You) を表示し (フォロー中タブにいたら『おすすめ』に切替)、以下の手順A〜Fを3件の投稿に対して繰り返してください: A) 上から順に通常投稿（広告やセンシティブや政治や宣伝色の強いものは避ける）を1件選ぶ B) その投稿のいいねボタン（ハートアイコン）をタップ C) 同じ投稿のリプライアイコン（吹き出し）をタップして返信入力欄を開く D) 投稿本文と文脈を踏まえて短い日本語リプライを2〜3行（合計80文字以内）で生成し入力 E) 『返信する』または『ポストする』ボタンをタップして送信 F) ホームタイムラインに戻り 少し下にスクロールして次の未操作投稿を探す。リプライのスタイルルール: 1) 文末や途中で『！』を積極的に使う 2) 読点『、』は絶対に使わない（区切りは半角スペースか改行で代替） 3) 煽りや営業っぽさは避ける 4) 絵文字は0〜2個まで 5) フレンドリーで素朴な感想にする。3件完了したら終了して 各投稿の概要と送信したリプライ内容を報告してください。リツイートはしないこと。"
