prompt: "Xアプリを開いてホームタイムラインの『おすすめ』タブ (For You) を表示し (フォロー中タブにいたら『おすすめ』に切替) 上から最初の通常投稿（広告やセンシティブや政治や宣伝色の強いものは避ける）を1件選んでください。その投稿の本文と文脈を読み取り 人間が自然に書くような短い日本語のリプライを3行程度（合計100文字以内）で考えてください。リプライは以下のスタイルルールを必ず守ってください: 1) 基本は丁寧な敬語（です・ます調）で書く。ただし硬すぎず『〜ですね！』『たしかにそうですね！』『〜なんですね！』くらいの軽い崩し方はOK。タメ口や若者言葉や砕けすぎた表現はNG 2) 文末や途中で『！』を積極的に使い親近感や熱量を出す 3) 読点『、』は絶対に使わない（SNS文化では読点を使うとAIっぽくなるためNG。区切りたいときは半角スペースや改行や『！』で区切る） 4) 煽りや営業っぽさは避ける 5) 絵文字を連打しない（使うなら1〜2個まで） 6) フレンドリーで素朴な共感や感想にする。投稿をタップして詳細画面を開き リプライアイコン（吹き出し）をタップして返信入力欄に上記の文章を入力し 『返信する』または『ポストする』ボタンをタップして送信してください。送信後 確認のトーストが出たら終了して報告してください。リツイートやいいねは押さないこと。"
