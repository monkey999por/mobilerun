prompt: "Xアプリを開きホームタイムラインを表示してください。タブ操作の指針: アプリ起動直後のタブのままで構わない 必要なら『フォロー中』タブに切り替えてもよいが 切り替えはこの1回のみ。投稿選定: 画面に見えている範囲の上から順に通常投稿（広告 センシティブ 政治 宣伝色の強いものは避ける）を1件選ぶ 引用ツイート（quote tweet）形式の投稿でもOK。投稿が見つからない場合のみ1回だけ下スクロールしてよい。コメント生成: 投稿本文と文脈を読み取り 短い日本語コメントを2〜3行（合計80文字以内）で1度だけドラフトする。一度ドラフトしたら絶対に書き直さず そのまま入力に使うこと。スタイルルール: 1) 文末や途中で『！』を積極的に使い親近感や熱量を出す 2) 読点『、』は絶対に使わない（区切りは半角スペースか改行で代替） 3) 煽りや営業っぽさは避ける 4) 絵文字は0〜2個まで 5) フレンドリーで素朴な感想にする。引用ツイート操作の重要ポイント: A) 各投稿のアクションバー（返信 / リポスト / いいね / ブックマーク / 共有 のアイコンが横並び）は常に投稿の下部に表示されているので アクションバーを表示するための追加スクロールは絶対に不要 B) アクションバーの並びは左から順に【1番目=返信(吹き出し)】【2番目=リポスト(円形の矢印)】【3番目=いいね(ハート)】【4番目=ブックマーク】【5番目=共有】 リポスト目的では必ず『2番目』のアイコンを狙うこと 1番目をタップすると返信画面が開いてしまうので注意 C) 座標で押す場合 画面幅1080なら2番目アイコンの中心は概ね x=350〜400 付近 D) リポストアイコンをタップすると『リポスト』『引用』のメニューが下から出てくるので『引用』を選択 E) 引用作成画面では送信ボタンに『リポスト』と表示される（『ポストする』ではない） これは正しいボタンなのでそのままタップして送信。送信後『ポストを送信しました』のトーストが出たら終了して報告してください。いいねやリプライは押さないこと。"
