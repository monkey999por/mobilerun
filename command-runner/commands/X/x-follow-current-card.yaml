notes: アトミック - 表示中のおすすめユーザーカードや検索結果上で最も上にある『フォロー』ボタンを1回押す
prompt: |
  現在 X 画面に表示されている『フォロー』ボタン (黒地に白文字、または『フォローする』表記) のうち、一番上にあるものを 1 回だけタップしてフォローしてください。

  ## 対象
  - おすすめユーザーカード / プロフィール画面 / 検索結果の各行末にある『フォロー』ボタン
  - すでに『フォロー中』表示になっているもの (白地に黒文字) はスキップ

  ## 手順
  1. 画面を上から舐めて最初に見つかった未フォロー (黒地の『フォロー』) ボタンをタップ
  2. タップ後に表示が『フォロー中』に切り替わったら成功
  3. 対象ユーザー名 / ハンドル名を報告して終了

  ## 見つからなかった場合
  "no follow button visible" と報告して終了 (呼び出し側でスクロール後リトライ)

  ## 絶対禁止
  - プロフィール画像や名前タップで詳細画面に遷移しない
  - 同じ画面で複数件フォローしない (1 件で必ず終了)
