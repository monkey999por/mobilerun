notes: アトミック - X を起動してホームの『おすすめ』(For You) タブにいる状態にして終了
prompt: |
  Xアプリ (Twitter) をフォアグラウンドに出してホームタイムラインの『おすすめ』(For You) タブを表示した状態で終了してください。

  ## 手順
  1. ホーム画面に X アプリのアイコンがあればタップ。無ければアプリ一覧から起動
  2. ログイン状態でなければ何もせず "not logged in" と報告して終了
  3. ホームタブに居なければ画面下部のホーム (家アイコン) をタップ
  4. 画面上部のタブが『フォロー中』になっていたら『おすすめ』をタップして切替
  5. タイムラインの先頭が見える状態 (一番上にスクロール) で終了

  ## 終了条件
  画面上部のタブが『おすすめ』にハイライトされ、下に投稿一覧が見えている。

  ## 絶対禁止
  - 投稿本文や画像をタップしない (詳細画面に入らない)
  - いいね・リポスト・リプライなどのアクションをしない
