notes: アトミック - 詳細画面や検索画面に入ってしまった時にホームのおすすめ TL まで戻すリカバリ
prompt: |
  現在 X アプリ内のどこか (投稿詳細・プロフィール・検索結果など) に居る前提で、ホームタイムラインの『おすすめ』タブまで戻ってください。

  ## 手順
  1. 左上の『戻る』(←) があれば 1〜2 回タップ
  2. 必要なら system back ボタンも使って戻る
  3. 画面下部のホーム (家アイコン) をタップして確実にホームへ
  4. 上部タブが『フォロー中』なら『おすすめ』をタップ
  5. TL 先頭が見える状態で終了

  ## 終了条件
  上部タブ『おすすめ』がハイライト、下に投稿一覧が見える状態。

  ## 絶対禁止
  - いいねやリプライなどの操作はしない (純粋なナビゲーションのみ)
